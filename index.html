<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日推送 · 内容聚合</title>
<style>
:root {
  --bg: #0d1117;
  --bg-card: #161b22;
  --bg-hover: #1c2128;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --accent: #2f81f7;
  --accent-hover: #388bfd;
  --accent-bg: rgba(56, 139, 253, 0.15);
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.6;
  min-height: 100vh;
}

/* ===== Header ===== */
header {
  border-bottom: 1px solid var(--border);
  padding: 20px 24px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 100;
}

.header-inner {
  max-width: 1000px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-sub {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 400;
}

.header-stats {
  font-size: 13px;
  color: var(--text-muted);
}

/* ===== Tabs ===== */
.tabs {
  max-width: 1000px;
  margin: 0 auto;
  padding: 16px 24px 0;
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border);
}

.tab {
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  border: none;
  background: none;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
  position: relative;
  bottom: -1px;
}

.tab:hover { color: var(--text); }

.tab.active {
  color: var(--text);
  border-bottom-color: var(--accent);
}

.tab-count {
  font-size: 12px;
  background: var(--border);
  color: var(--text-muted);
  padding: 1px 7px;
  border-radius: 10px;
  min-width: 20px;
  text-align: center;
}

.tab.active .tab-count {
  background: var(--accent-bg);
  color: var(--accent);
}

/* ===== Content ===== */
.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 24px;
}

.card-list { display: flex; flex-direction: column; gap: 12px; }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  text-decoration: none;
  color: inherit;
  transition: all 0.2s;
  display: block;
}

.card:hover {
  background: var(--bg-hover);
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.card-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
}

.card-date {
  font-size: 13px;
  color: var(--text-muted);
  white-space: nowrap;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.card-summary {
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}


/* ===== Pagination ===== */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 24px;
  padding-bottom: 40px;
}

.page-btn {
  padding: 6px 14px;
  font-size: 14px;
  color: var(--text);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
}

.page-btn:hover:not(:disabled) {
  background: var(--bg-hover);
  border-color: var(--accent);
}

.page-btn:disabled {
  color: var(--border);
  cursor: not-allowed;
}

.page-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.page-info {
  font-size: 13px;
  color: var(--text-muted);
  padding: 0 8px;
}

/* ===== Loading & Empty ===== */
.loading, .empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  font-size: 14px;
}

.loading::after {
  content: '';
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-left: 8px;
  vertical-align: middle;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Responsive ===== */
@media (max-width: 640px) {
  header { padding: 14px 16px; }
  .header-inner { flex-direction: column; gap: 8px; align-items: flex-start; }
  .tabs { padding: 12px 16px 0; overflow-x: auto; }
  .tab { padding: 8px 14px; font-size: 13px; white-space: nowrap; }
  .container { padding: 16px; }
  .card { padding: 16px; }
  .card-header { flex-direction: column; gap: 4px; }
  .card-date { font-size: 12px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      📋 每日推送
      <span class="logo-sub">内容聚合</span>
    </div>
    <div class="header-stats" id="header-stats"></div>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<main class="container">
  <div id="content">
    <div class="loading">加载中</div>
  </div>
  <div class="pagination" id="pagination" style="display:none;"></div>
</main>

<script src="data.js"></script>
<script>
const PAGE_SIZE = 20;

let manifest = null;
let currentModule = null;
let currentPage = 1;

function init() {
  if (window.MANIFEST) {
    manifest = window.MANIFEST;
    renderTabs();
    const firstKey = Object.keys(manifest.modules)[0];
    selectModule(firstKey);
  } else {
    document.getElementById('content').innerHTML =
      '<div class="empty">数据加载失败，请确保 data.js 文件存在</div>';
  }
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  const statsEl = document.getElementById('header-stats');
  let total = 0;

  tabsEl.innerHTML = '';
  for (const [key, mod] of Object.entries(manifest.modules)) {
    total += mod.items.length;
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.dataset.module = key;
    btn.innerHTML = `${mod.icon} ${mod.name} <span class="tab-count">${mod.items.length}</span>`;
    btn.addEventListener('click', () => selectModule(key));
    tabsEl.appendChild(btn);
  }

  statsEl.textContent = `共 ${total} 篇`;
}

function selectModule(key) {
  currentModule = key;
  currentPage = 1;

  // 更新tab状态
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.module === key);
  });

  renderList();
}

function renderList() {
  const mod = manifest.modules[currentModule];
  const items = mod.items;
  const totalPages = Math.ceil(items.length / PAGE_SIZE);
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = items.slice(start, start + PAGE_SIZE);

  const contentEl = document.getElementById('content');

  if (pageItems.length === 0) {
    contentEl.innerHTML = '<div class="empty">暂无内容</div>';
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  const listEl = document.createElement('div');
  listEl.className = 'card-list';

  for (const item of pageItems) {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = item.path;
    card.target = '_blank';
    card.rel = 'noopener';

    card.innerHTML = `
      <div class="card-header">
        <div class="card-title">${escapeHtml(item.title)}</div>
        <div class="card-date">${item.date}</div>
      </div>
      <div class="card-summary">${escapeHtml(item.summary)}</div>
    `;

    listEl.appendChild(card);
  }

  contentEl.innerHTML = '';
  contentEl.appendChild(listEl);

  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const pagEl = document.getElementById('pagination');

  if (totalPages <= 1) {
    pagEl.style.display = 'none';
    return;
  }

  pagEl.style.display = 'flex';
  pagEl.innerHTML = '';

  // 上一页
  const prevBtn = document.createElement('button');
  prevBtn.className = 'page-btn';
  prevBtn.textContent = '上一页';
  prevBtn.disabled = currentPage === 1;
  prevBtn.addEventListener('click', () => { currentPage--; renderList(); window.scrollTo(0, 0); });
  pagEl.appendChild(prevBtn);

  // 页码
  const maxVisible = 7;
  let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
  let endPage = Math.min(totalPages, startPage + maxVisible - 1);
  if (endPage - startPage < maxVisible - 1) {
    startPage = Math.max(1, endPage - maxVisible + 1);
  }

  if (startPage > 1) {
    const firstBtn = document.createElement('button');
    firstBtn.className = 'page-btn';
    firstBtn.textContent = '1';
    firstBtn.addEventListener('click', () => { currentPage = 1; renderList(); window.scrollTo(0, 0); });
    pagEl.appendChild(firstBtn);
    if (startPage > 2) {
      const dots = document.createElement('span');
      dots.className = 'page-info';
      dots.textContent = '...';
      pagEl.appendChild(dots);
    }
  }

  for (let i = startPage; i <= endPage; i++) {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
    btn.textContent = i;
    btn.addEventListener('click', () => { currentPage = i; renderList(); window.scrollTo(0, 0); });
    pagEl.appendChild(btn);
  }

  if (endPage < totalPages) {
    if (endPage < totalPages - 1) {
      const dots = document.createElement('span');
      dots.className = 'page-info';
      dots.textContent = '...';
      pagEl.appendChild(dots);
    }
    const lastBtn = document.createElement('button');
    lastBtn.className = 'page-btn';
    lastBtn.textContent = totalPages;
    lastBtn.addEventListener('click', () => { currentPage = totalPages; renderList(); window.scrollTo(0, 0); });
    pagEl.appendChild(lastBtn);
  }

  // 下一页
  const nextBtn = document.createElement('button');
  nextBtn.className = 'page-btn';
  nextBtn.textContent = '下一页';
  nextBtn.disabled = currentPage === totalPages;
  nextBtn.addEventListener('click', () => { currentPage++; renderList(); window.scrollTo(0, 0); });
  pagEl.appendChild(nextBtn);

  // 页码信息
  const info = document.createElement('span');
  info.className = 'page-info';
  info.textContent = `${currentPage} / ${totalPages}`;
  pagEl.appendChild(info);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// 启动
init();
</script>

</body>
</html>
