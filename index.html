<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日推送 · 内容聚合</title>
<style>
:root {
  --bg: #0d1117;
  --bg-card: #161b22;
  --bg-hover: #1c2128;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --accent: #2f81f7;
  --accent-hover: #388bfd;
  --accent-bg: rgba(56, 139, 253, 0.15);
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
  --c-movie: #e94560;
  --c-story: #8b5cf6;
  --c-ai: #2f81f7;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0e16;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.6;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* ===== Animated Gradient Background ===== */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(47, 129, 247, 0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(136, 87, 229, 0.15) 0%, transparent 50%),
    radial-gradient(ellipse 50% 40% at 0% 80%, rgba(233, 69, 96, 0.12) 0%, transparent 50%),
    radial-gradient(ellipse 70% 50% at 50% 50%, rgba(20, 184, 166, 0.08) 0%, transparent 50%),
    linear-gradient(180deg, #0d1117 0%, #0a0e16 50%, #0d1117 100%);
  z-index: -2;
}

body::after {
  content: '';
  position: fixed;
  top: -20%; left: -20%; right: -20%; bottom: -20%;
  background:
    radial-gradient(ellipse 40% 30% at 25% 35%, rgba(47, 129, 247, 0.14), transparent 50%),
    radial-gradient(ellipse 35% 25% at 75% 65%, rgba(136, 87, 229, 0.14), transparent 50%),
    radial-gradient(ellipse 30% 20% at 50% 85%, rgba(233, 69, 96, 0.10), transparent 50%),
    radial-gradient(ellipse 25% 20% at 15% 70%, rgba(20, 184, 166, 0.08), transparent 50%);
  animation: gradient-drift 25s ease-in-out infinite alternate;
  z-index: -1;
  pointer-events: none;
}

@keyframes gradient-drift {
  0%   { transform: translate(0, 0) scale(1); }
  33%  { transform: translate(3%, -2%) scale(1.05); }
  66%  { transform: translate(-3%, 2%) scale(0.98); }
  100% { transform: translate(1%, 1%) scale(1.02); }
}

/* ===== Header ===== */
header {
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(13, 17, 23, 0.85);
  backdrop-filter: blur(12px);
  z-index: 100;
}

.header-inner {
  max-width: 1000px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 16px 24px;
}

.header-orbs { display: flex; align-items: center; gap: 10px; }

.orb {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  animation: orb-pulse 2.4s ease-in-out infinite;
}

.orb-1 { background: var(--c-movie); box-shadow: 0 0 12px rgba(233, 69, 96, 0.6); animation-delay: 0s; }
.orb-2 { background: var(--c-story); box-shadow: 0 0 12px rgba(139, 92, 246, 0.6); animation-delay: 0.3s; }
.orb-3 { background: var(--c-ai); box-shadow: 0 0 12px rgba(47, 129, 247, 0.6); animation-delay: 0.6s; }

@keyframes orb-pulse {
  0%, 100% { opacity: 0.35; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.4); }
}

.header-line {
  flex: 1;
  max-width: 280px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(47, 129, 247, 0.5), transparent);
  position: relative;
  overflow: hidden;
}

.header-line::after {
  content: '';
  position: absolute;
  top: 0;
  left: -50%;
  width: 50%;
  height: 100%;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  animation: line-slide 3s ease-in-out infinite;
}

@keyframes line-slide {
  0% { left: -50%; }
  100% { left: 100%; }
}

/* ===== Top Tabs ===== */
.tabs {
  max-width: 1000px;
  margin: 0 auto;
  padding: 16px 24px 0;
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border);
}

.tab {
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  border: none;
  background: none;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
  position: relative;
  bottom: -1px;
}

.tab:hover { color: var(--text); }

.tab.active {
  color: var(--text);
  border-bottom-color: var(--accent);
}

.tab-count {
  font-size: 12px;
  background: var(--border);
  color: var(--text-muted);
  padding: 1px 7px;
  border-radius: 10px;
  min-width: 20px;
  text-align: center;
}

.tab.active .tab-count {
  background: var(--accent-bg);
  color: var(--accent);
}

/* ===== Side Bookmark Tabs ===== */
.side-tabs {
  position: fixed;
  right: 0;
  top: 50%;
  transform: translateY(-50%) translateX(20px);
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s, transform 0.3s;
}

.side-tabs.visible {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(-50%) translateX(0);
}

.side-tab {
  height: 64px;
  width: 6px;
  border-radius: 8px 0 0 8px;
  background: var(--bg-card);
  cursor: pointer;
  overflow: hidden;
  transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  border: 1px solid var(--border);
  border-right: none;
  padding: 0;
  display: flex;
  align-items: center;
  white-space: nowrap;
  box-shadow: -2px 0 8px rgba(0,0,0,0.3);
}

.side-tab:hover {
  width: 175px;
  padding-right: 16px;
}

.side-tab.active {
  width: 8px;
}

.side-tab.active:hover {
  width: 175px;
}

.side-tab-bar {
  width: 6px;
  height: 100%;
  flex-shrink: 0;
  transition: box-shadow 0.3s, width 0.3s;
}

.side-tab.active .side-tab-bar {
  width: 8px;
  box-shadow: 0 0 16px currentColor;
}

.side-tab:hover .side-tab-bar {
  width: 6px;
  box-shadow: none;
}

.side-tab-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  padding-left: 14px;
  opacity: 0;
  transition: opacity 0.15s ease 0.1s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.side-tab:hover .side-tab-label {
  opacity: 1;
}

.side-tab-label .tab-count {
  font-size: 12px;
  background: var(--border);
  color: var(--text-muted);
  padding: 1px 7px;
  border-radius: 10px;
  min-width: 20px;
  text-align: center;
}

/* ===== Content ===== */
.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 24px;
}

.card-list { display: flex; flex-direction: column; gap: 12px; }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  text-decoration: none;
  color: inherit;
  transition: all 0.2s;
  display: block;
  cursor: pointer;
}

.card:hover {
  background: var(--bg-hover);
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.card-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
}

.rewatch-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 12px;
  font-weight: 500;
  color: #f0a04b;
  background: rgba(240, 160, 75, 0.14);
  border: 1px solid rgba(240, 160, 75, 0.35);
  border-radius: 10px;
  padding: 1px 8px;
  margin-left: 8px;
  vertical-align: 2px;
  white-space: nowrap;
}

.card-date {
  font-size: 13px;
  color: var(--text-muted);
  white-space: nowrap;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.card-summary {
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ===== Pagination ===== */
.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 24px;
  padding-bottom: 40px;
}

.page-btn {
  padding: 6px 14px;
  font-size: 14px;
  color: var(--text);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
}

.page-btn:hover:not(:disabled) {
  background: var(--bg-hover);
  border-color: var(--accent);
}

.page-btn:disabled {
  color: var(--border);
  cursor: not-allowed;
}

.page-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.page-info {
  font-size: 13px;
  color: var(--text-muted);
  padding: 0 8px;
}

/* ===== Content Overlay (in-page viewing) ===== */
.content-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.92);
  z-index: 999;
  display: none;
  flex-direction: column;
  animation: overlay-in 0.2s ease;
}

.content-overlay.visible {
  display: flex;
}

@keyframes overlay-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

.overlay-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.overlay-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  margin-right: 16px;
}

.overlay-close {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--bg-hover);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}

.overlay-close:hover {
  background: var(--c-movie);
  border-color: var(--c-movie);
  color: #fff;
}

.overlay-body {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.overlay-body iframe {
  width: 100%;
  height: 100%;
  border: none;
  background: #fff;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.overlay-body iframe.loaded {
  opacity: 1;
}

/* Loading transition screen */
.overlay-loader {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: #0d1117;
  z-index: 2;
  transition: opacity 0.3s ease;
}

.overlay-loader.hidden {
  opacity: 0;
  pointer-events: none;
}

.loader-spinner {
  width: 42px;
  height: 42px;
  border: 3px solid rgba(255, 255, 255, 0.12);
  border-top-color: #58a6ff;
  border-radius: 50%;
  animation: spinner-rotate 0.8s linear infinite;
}

@keyframes spinner-rotate {
  to { transform: rotate(360deg); }
}

.loader-text {
  font-size: 13px;
  color: #8b949e;
  letter-spacing: 1px;
}

/* ===== Loading & Empty ===== */
.loading, .empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  font-size: 14px;
}

.loading::after {
  content: '';
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-left: 8px;
  vertical-align: middle;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Responsive ===== */
@media (max-width: 640px) {
  .header-inner { padding: 12px 16px; }
  .header-line { max-width: 80px; }
  .tabs { padding: 12px 16px 0; overflow-x: auto; }
  .tab { padding: 8px 14px; font-size: 13px; white-space: nowrap; }
  .container { padding: 16px; }
  .card { padding: 16px; }
  .card-header { flex-direction: column; gap: 4px; }
  .card-date { font-size: 12px; }
  .side-tab:hover { width: 145px; }
  .side-tab-label { font-size: 13px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-line"></div>
    <div class="header-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>
    <div class="header-line"></div>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>

<!-- Side bookmark tabs (appear on scroll) -->
<div class="side-tabs" id="side-tabs"></div>

<main class="container">
  <div id="content">
    <div class="loading">加载中</div>
  </div>
  <div class="pagination" id="pagination" style="display:none;"></div>
</main>

<!-- Content overlay for in-page viewing -->
<div class="content-overlay" id="content-overlay">
  <div class="overlay-header">
    <div class="overlay-title" id="overlay-title"></div>
    <button class="overlay-close" id="overlay-close" title="关闭 (ESC)">✕</button>
  </div>
  <div class="overlay-body">
    <div class="overlay-loader" id="overlay-loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">正在加载，请稍候…</div>
    </div>
    <iframe id="content-iframe" src=""></iframe>
  </div>
</div>

<script>
const PAGE_SIZE = 20;

// Module colors
const MODULE_COLORS = {
  'classic-movies': '#e94560',
  'bedtime-stories': '#8b5cf6',
  'ai-info': '#2f81f7',
};

let manifest = null;
let currentModule = null;
let currentPage = 1;

async function init() {
  try {
    const res = await fetch('manifest.json');
    manifest = await res.json();
    renderTabs();
    renderSideTabs();
    const firstKey = Object.keys(manifest.modules)[0];
    selectModule(firstKey);
    setupScrollListener();
    setupOverlay();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="empty">数据加载失败：' + e.message + '<br>请通过 HTTP 服务访问（如 python3 -m http.server）</div>';
  }
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  for (const [key, mod] of Object.entries(manifest.modules)) {
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.dataset.module = key;
    btn.innerHTML = `${mod.icon} ${mod.name} <span class="tab-count">${mod.items.length}</span>`;
    btn.addEventListener('click', () => selectModule(key));
    tabsEl.appendChild(btn);
  }
}

function renderSideTabs() {
  const sideEl = document.getElementById('side-tabs');
  sideEl.innerHTML = '';
  for (const [key, mod] of Object.entries(manifest.modules)) {
    const color = MODULE_COLORS[key] || '#2f81f7';
    const btn = document.createElement('button');
    btn.className = 'side-tab';
    btn.dataset.module = key;
    btn.innerHTML = `
      <div class="side-tab-bar" style="background: ${color}; color: ${color};"></div>
      <div class="side-tab-label">${mod.icon} ${mod.name} <span class="tab-count">${mod.items.length}</span></div>
    `;
    btn.addEventListener('click', () => {
      selectModule(key);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    sideEl.appendChild(btn);
  }
}

function selectModule(key) {
  currentModule = key;
  currentPage = 1;

  // Update top tabs
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.module === key);
  });

  // Update side tabs
  document.querySelectorAll('.side-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.module === key);
  });

  renderList();
}

function renderList() {
  const mod = manifest.modules[currentModule];
  const items = mod.items;
  const totalPages = Math.ceil(items.length / PAGE_SIZE);
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = items.slice(start, start + PAGE_SIZE);

  const contentEl = document.getElementById('content');

  if (pageItems.length === 0) {
    contentEl.innerHTML = '<div class="empty">暂无内容</div>';
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  const listEl = document.createElement('div');
  listEl.className = 'card-list';

  for (const item of pageItems) {
    const card = document.createElement('div');
    card.className = 'card';
    const badge = item.rewatch ? `<span class="rewatch-badge">🔁 重温${item.rewatch}次</span>` : '';
    card.innerHTML = `
      <div class="card-header">
        <div class="card-title">${escapeHtml(item.title)}${badge}</div>
        <div class="card-date">${item.date}</div>
      </div>
      <div class="card-summary">${escapeHtml(item.summary)}</div>
    `;
    card.addEventListener('click', () => openContent(item.path, item.title));
    listEl.appendChild(card);
  }

  contentEl.innerHTML = '';
  contentEl.appendChild(listEl);

  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const pagEl = document.getElementById('pagination');

  if (totalPages <= 1) {
    pagEl.style.display = 'none';
    return;
  }

  pagEl.style.display = 'flex';
  pagEl.innerHTML = '';

  // 上一页
  const prevBtn = document.createElement('button');
  prevBtn.className = 'page-btn';
  prevBtn.textContent = '上一页';
  prevBtn.disabled = currentPage === 1;
  prevBtn.addEventListener('click', () => { currentPage--; renderList(); window.scrollTo(0, 0); });
  pagEl.appendChild(prevBtn);

  // 页码
  const maxVisible = 7;
  let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
  let endPage = Math.min(totalPages, startPage + maxVisible - 1);
  if (endPage - startPage < maxVisible - 1) {
    startPage = Math.max(1, endPage - maxVisible + 1);
  }

  if (startPage > 1) {
    const firstBtn = document.createElement('button');
    firstBtn.className = 'page-btn';
    firstBtn.textContent = '1';
    firstBtn.addEventListener('click', () => { currentPage = 1; renderList(); window.scrollTo(0, 0); });
    pagEl.appendChild(firstBtn);
    if (startPage > 2) {
      const dots = document.createElement('span');
      dots.className = 'page-info';
      dots.textContent = '...';
      pagEl.appendChild(dots);
    }
  }

  for (let i = startPage; i <= endPage; i++) {
    const btn = document.createElement('button');
    btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
    btn.textContent = i;
    btn.addEventListener('click', () => { currentPage = i; renderList(); window.scrollTo(0, 0); });
    pagEl.appendChild(btn);
  }

  if (endPage < totalPages) {
    if (endPage < totalPages - 1) {
      const dots = document.createElement('span');
      dots.className = 'page-info';
      dots.textContent = '...';
      pagEl.appendChild(dots);
    }
    const lastBtn = document.createElement('button');
    lastBtn.className = 'page-btn';
    lastBtn.textContent = totalPages;
    lastBtn.addEventListener('click', () => { currentPage = totalPages; renderList(); window.scrollTo(0, 0); });
    pagEl.appendChild(lastBtn);
  }

  // 下一页
  const nextBtn = document.createElement('button');
  nextBtn.className = 'page-btn';
  nextBtn.textContent = '下一页';
  nextBtn.disabled = currentPage === totalPages;
  nextBtn.addEventListener('click', () => { currentPage++; renderList(); window.scrollTo(0, 0); });
  pagEl.appendChild(nextBtn);

  // 页码信息
  const info = document.createElement('span');
  info.className = 'page-info';
  info.textContent = `${currentPage} / ${totalPages}`;
  pagEl.appendChild(info);
}

/* ===== Scroll: show/hide side bookmark tabs ===== */
function setupScrollListener() {
  const sideTabs = document.getElementById('side-tabs');
  const tabsEl = document.getElementById('tabs');

  function checkScroll() {
    const threshold = tabsEl.offsetTop + tabsEl.offsetHeight + 20;
    if (window.scrollY > threshold) {
      sideTabs.classList.add('visible');
    } else {
      sideTabs.classList.remove('visible');
    }
  }

  window.addEventListener('scroll', checkScroll, { passive: true });
  checkScroll();
}

/* ===== Content overlay: in-page viewing ===== */
function setupOverlay() {
  const overlay = document.getElementById('content-overlay');
  const closeBtn = document.getElementById('overlay-close');
  const iframe = document.getElementById('content-iframe');
  const loader = document.getElementById('overlay-loader');

  closeBtn.addEventListener('click', closeContent);

  // iframe 加载完成后：隐藏过渡屏，淡入内容
  iframe.addEventListener('load', () => {
    loader.classList.add('hidden');
    iframe.classList.add('loaded');
  });

  // Click on overlay background to close
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeContent();
  });

  // ESC to close
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('visible')) {
      closeContent();
    }
  });
}

function openContent(path, title) {
  const overlay = document.getElementById('content-overlay');
  const iframe = document.getElementById('content-iframe');
  const titleEl = document.getElementById('overlay-title');
  const loader = document.getElementById('overlay-loader');

  // 重置状态：显示过渡屏，内容隐藏
  iframe.classList.remove('loaded');
  loader.classList.remove('hidden');

  iframe.src = path;
  titleEl.textContent = title;
  overlay.classList.add('visible');
  document.body.style.overflow = 'hidden';
}

function closeContent() {
  const overlay = document.getElementById('content-overlay');
  const iframe = document.getElementById('content-iframe');

  iframe.src = '';
  overlay.classList.remove('visible');
  document.body.style.overflow = '';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Start
init();
</script>
